    flap.classList.add('open');
    flap.querySelector('.k').textContent = 'Unsealed · ' + v.sealedLabel;
    if(!PROGRESS.dossiers.includes(v.id)){ PROGRESS.dossiers.push(v.id); saveProgress(); paintProgress(); }
  };
}
function closeDossier(){
  document.getElementById('scrim').classList.remove('on');
  document.body.style.overflow = '';
  RENDER.gallery();
}
document.getElementById('scrim').onclick = e => { if(e.target.id === 'scrim') closeDossier(); };
document.addEventListener('keydown', e => { if(e.key === 'Escape' && document.getElementById('scrim').classList.contains('on')) closeDossier(); });

/* ============================ VIEW: SORT ============================ */
let picked = null;
RENDER.sort = function(){
  const S = SPEC.sort;
  const el = document.getElementById('v-sort');
  picked = null;
  if(!PROGRESS.sortState){
    const order = S.items.map((_,i)=>i).sort(()=>Math.random()-0.5);
    const place = {}; order.forEach(i => place[i] = 'pool');
    PROGRESS.sortState = { order, place };
    saveProgress();
  }
  const st = PROGRESS.sortState;
  const chipHtml = i => `<div class="chip" draggable="true" data-i="${i}">${esc(S.items[i].name)}</div>`;
  const zoneHtml = z => st.order.filter(i => st.place[i] === z).map(chipHtml).join('');
  el.innerHTML = `
    <span class="eyebrow">Part three</span>
    <h2>${esc(S.head)}</h2>
    <p class="sub">${S.sub}</p>
    <div class="dnd-pool" id="pool">${zoneHtml('pool')}</div>
    <div class="bins">
      ${S.bins.map(b => `<div class="bin" data-bin="${b.key}"><h5>${esc(b.label)}</h5><div class="bsub">${esc(b.sub||'')}</div><div class="drop">${zoneHtml(b.key)}</div></div>`).join('')}
    </div>
    <div style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn" id="checkSort">Check it</button>
      <button class="btn ghost" id="resetSort">Start over</button>
    </div>
    <div class="feedback" id="sortFb"></div>
    <div style="margin-top:26px"><button class="btn ghost" id="toField">${esc(S.cta)}</button></div>
  `;

  const pool = el.querySelector('#pool');
  const chips = () => el.querySelectorAll('.chip');
  const zones = [pool, ...el.querySelectorAll('.bin .drop')];

  function wire(){
    chips().forEach(c => {
      c.ondragstart = e => { e.dataTransfer.setData('text/plain', c.dataset.i); e.dataTransfer.effectAllowed='move'; };
      c.onclick = () => {
        if(picked === c){ c.classList.remove('picked'); picked = null; return; }
        chips().forEach(x=>x.classList.remove('picked'));
        c.classList.add('picked'); picked = c;
      };
    });
  }
  function drop(target, i){
    const chip = el.querySelector(`.chip[data-i="${i}"]`);
    if(!chip) return;
    target.appendChild(chip);
    chip.classList.remove('picked','right','wrong');
    picked = null;
    const bin = target.closest('.bin');
    st.place[i] = bin ? bin.dataset.bin : 'pool';
    st.order = [...el.querySelectorAll('.chip')].map(c => +c.dataset.i);
    saveProgress();
  }
  zones.forEach(z => {
    const host = z.classList.contains('drop') ? z.parentElement : z;
    z.ondragover = e => { e.preventDefault(); host.classList.add('over'); };
    z.ondragleave = () => host.classList.remove('over');
    z.ondrop = e => { e.preventDefault(); host.classList.remove('over'); drop(z, e.dataTransfer.getData('text/plain')); };
    z.onclick = e => { if(picked && !e.target.classList.contains('chip')) drop(z, picked.dataset.i); };
  });
  el.querySelectorAll('.bin').forEach(b => b.onclick = e => {
    if(picked && !e.target.classList.contains('chip')) drop(b.querySelector('.drop'), picked.dataset.i);
  });

  el.querySelector('#checkSort').onclick = () => {
    let right = 0, misses = [];
    const unplaced = pool.querySelectorAll('.chip').length;
    el.querySelectorAll('.bin').forEach(bin => {
      bin.querySelectorAll('.chip').forEach(c => {
        const it = S.items[+c.dataset.i];
        const ok = it.bin === bin.dataset.bin;
        c.classList.toggle('right', ok); c.classList.toggle('wrong', !ok);
        if(ok) right++; else misses.push(it);
      });
    });
    const total = S.items.length;
    const fb = el.querySelector('#sortFb');
    fb.className = 'feedback on ' + (right===total ? 'good' : 'bad');
    fb.innerHTML = right===total
      ? `<b style="font-family:var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--green)">${total} for ${total}</b><br>${S.win}`
      : `<b style="font-family:var(--display);letter-spacing:.1em;text-transform:uppercase">${right} of ${total} placed correctly${unplaced?`, ${unplaced} still in the pool`:''}</b>
         <div style="margin-top:10px">${misses.map(m => `<div style="margin-bottom:6px"><b>${esc(m.name)}</b> · ${m.why}</div>`).join('')}</div>`;
    if(PROGRESS.sortBest == null || right > PROGRESS.sortBest){ PROGRESS.sortBest = right; saveProgress(); }
    paintProgress();
  };
  el.querySelector('#resetSort').onclick = () => {
    el.querySelectorAll('.bin .chip').forEach(c => {
      c.classList.remove('right','wrong','picked');
      pool.appendChild(c);
      st.place[+c.dataset.i] = 'pool';
    });
    saveProgress();
    el.querySelector('#sortFb').className = 'feedback';
  };
  wire();
};

/* ============================ VIEW: FIELD TEST ============================ */
let activeScen = null, scenNode = null, scenTrail = [];
RENDER.field = function(){
  const F = SPEC.field;
  const el = document.getElementById('v-field');
  if(!activeScen && PROGRESS.scenState){
    const s = F.scenarios.find(x => x.id === PROGRESS.scenState.id);
    if(s && s.nodes[PROGRESS.scenState.node]){
      activeScen = s; scenNode = PROGRESS.scenState.node; scenTrail = (PROGRESS.scenState.trail || []).slice();
    } else { PROGRESS.scenState = null; }
  }
  if(activeScen) return paintScen();
  el.innerHTML = `
    <span class="eyebrow">Part four</span>
    <h2>${esc(F.head)}</h2>
    <p class="sub">${F.sub}</p>
    <div class="scen-pick">
      ${F.scenarios.map(s => {
        const rec = PROGRESS.scenarios.find(x => x.id === s.id);
        return `<div class="card ${rec?'read':''}" data-scen="${s.id}">
          <div class="no">${esc(s.line)}</div>
          <div class="nm">${esc(s.title)}</div>
          <div class="teaser">${s.setup}</div>
          <span class="more">${rec ? (rec.win?'Held the standard · run again':'Ended short · run again') : 'Run the scenario'}</span>
        </div>`;
      }).join('')}
    </div>
    <div style="margin-top:26px"><button class="btn" id="toQuiz">Take the assessment</button></div>
  `;
  el.querySelectorAll('[data-scen]').forEach(c => c.onclick = () => {
    activeScen = F.scenarios.find(s => s.id === c.dataset.scen);
    scenNode = activeScen.start; scenTrail = [];
    paintScen();
  });
  el.querySelector('#toQuiz').onclick = () => go('quiz');
};
function paintScen(){
  const el = document.getElementById('v-field');
  const s = activeScen, n = s.nodes[scenNode];
  if(n.end){
    const rec = PROGRESS.scenarios.find(x => x.id === s.id);
    if(rec){ rec.win = rec.win || n.win; } else { PROGRESS.scenarios.push({id:s.id, win:n.win}); }
    PROGRESS.scenState = null;
    saveProgress(); paintProgress();
  } else {
    PROGRESS.scenState = { id:s.id, node:scenNode, trail:scenTrail.slice() };
    saveProgress();
  }
  el.innerHTML = `
    <button class="btn ghost" id="backScen" style="margin-bottom:18px">← All scenarios</button>
    <span class="eyebrow">${esc(s.line)}</span>
    <h2>${esc(s.title)}</h2>
    <p class="sub">${s.setup}</p>
    ${n.end ? `
      <div class="outcome ${n.win?'win':(n.verdict==='Partial'?'':'loss')}">
        <div class="verdict">${esc(n.verdict)}</div>
        <p style="margin:0 0 14px">${n.text}</p>
        <div style="border-top:1px solid var(--line);padding-top:12px">
          <div class="hint" style="margin-bottom:6px">Why it played out that way</div>
          <p style="margin:0">${n.why}</p>
        </div>
        <div class="trail">Your line: ${scenTrail.join(' → ')}</div>
      </div>
      <div style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn" id="againScen">Run it again</button>
        <button class="btn ghost" id="backScen2">Pick another scenario</button>
      </div>`
    : `
      <div class="node">
        <div class="stage">Decision ${scenTrail.length + 1}</div>
        <p class="text">${n.text}</p>
        <div class="choices">
          ${n.choices.map((c,i) => `<button class="choice" data-to="${c.to}" data-i="${i}">${c.t}</button>`).join('')}
        </div>
      </div>
      ${scenTrail.length ? `<div class="trail">Your line so far: ${scenTrail.join(' → ')}</div>` : ''}`}
  `;
  const back = () => { activeScen = null; PROGRESS.scenState = null; saveProgress(); RENDER.field(); };
  el.querySelector('#backScen').onclick = back;
  if(el.querySelector('#backScen2')) el.querySelector('#backScen2').onclick = back;
  if(el.querySelector('#againScen')) el.querySelector('#againScen').onclick = () => { scenNode = s.start; scenTrail = []; paintScen(); };
  el.querySelectorAll('.choice').forEach(b => b.onclick = () => {
    scenTrail.push('option ' + 'ABCD'[+b.dataset.i]);
    scenNode = b.dataset.to;
    paintScen();
    window.scrollTo({top:0, behavior:'smooth'});
  });
}

/* ============================ VIEW: QUIZ ============================ */
const QUIZ = SPEC.quiz.items;
const PASS = SPEC.quiz.pass;
let qi = 0, answers = [], quizOrder = [], quizLive = false;
RENDER.quiz = function(){
  const el = document.getElementById('v-quiz');
  if(!quizLive) return paintQuizIntro(el);
  paintQuestion(el);
};
function paintQuizIntro(el){
  const prior = ATTEMPTS.filter(a => a.name === (PROFILE.name || 'Unnamed'));
  const open = PROGRESS.quizState;
  el.innerHTML = `
    <span class="eyebrow">Part five</span>
    <h2>Assessment</h2>
    <p class="sub">${QUIZ.length} questions. You answer, it tells you immediately whether you got it, and it explains both the right answer and the one you picked. No going back to change it, which is the point. Pass mark is ${PASS} of ${QUIZ.length}. If you close the module partway through, the attempt waits for you.</p>
    ${open ? `<div class="resumebar">
      <div style="flex:1;min-width:220px">
        <b style="font-family:var(--display);text-transform:uppercase;letter-spacing:.1em;font-size:13px;color:var(--prism);display:block;margin-bottom:4px">Attempt in progress</b>
        Question ${open.qi + 1} of ${QUIZ.length}, ${open.answers.filter(a=>a.ok).length} correct so far. Started ${ago(PROGRESS.updatedAt)}.
      </div>
      <button class="btn" id="resumeQ">Pick up at question ${open.qi + 1}</button>
      <button class="btn ghost" id="dropQ">Scrap it, start fresh</button>
    </div>` : ''}
    <div class="panel">
      <div class="hint" style="margin-bottom:8px">Recording as</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
        <input type="text" id="qName" placeholder="Your name or employee ID" value="${esc(PROFILE.name)}" style="flex:1">
        <button class="btn" id="startQuiz">Begin</button>
      </div>
      <label class="check" style="margin-top:14px">
        <input type="checkbox" id="qShare" ${PROFILE.share?'checked':''}> Add this result to the shared cohort roster
      </label>
      <p class="note" style="margin:8px 0 0">This is practice, not the gate. The gate is the written assessment the Training Lead issues and marks under ${SPEC.certRef}.</p>
      ${prior.length ? `<p class="note" style="margin:14px 0 0;border-top:1px solid var(--line);padding-top:12px">Previous attempts under this name: ${prior.length}. Best so far: ${Math.max(...prior.map(a=>a.score))}/${QUIZ.length}.</p>` : ''}
    </div>
  `;
  if(el.querySelector('#resumeQ')){
    el.querySelector('#resumeQ').onclick = () => resumeQuiz();
    el.querySelector('#dropQ').onclick = () => { PROGRESS.quizState = null; saveProgress(); RENDER.quiz(); };
  }
  el.querySelector('#startQuiz').onclick = () => {
    PROFILE.name = el.querySelector('#qName').value.trim();
    PROFILE.share = el.querySelector('#qShare').checked;
    saveProfile();
    qi = 0; answers = []; quizLive = true;
    quizOrder = QUIZ.map((q,i)=>i).sort(()=>Math.random()-0.5);
    PROGRESS.quizState = { order:quizOrder, qi:0, answers:[], name:PROFILE.name };
    saveProgress();
    RENDER.quiz();
  };
}
function paintQuestion(el){
  const q = QUIZ[quizOrder[qi]];
  const order = q.opts.map((o,i)=>i).sort(()=>Math.random()-0.5);
  el.innerHTML = `
    <div class="qhead">
      <span class="n">Question ${qi+1} of ${QUIZ.length}</span>
      <span class="n">${answers.filter(a=>a.ok).length} correct so far</span>
    </div>
    <p class="qtext">${q.q}</p>
    <div class="opts">
      ${order.map((oi,pos) => `<button class="opt" data-oi="${oi}"><span class="ltr">${'ABCD'[pos]}</span><span>${q.opts[oi].t}</span></button>`).join('')}
    </div>
    <div class="rationale" id="rat"></div>
    <div id="nextWrap" style="margin-top:18px;display:none">
      <button class="btn" id="nextQ">${qi === QUIZ.length-1 ? 'See your score' : 'Next question'}</button>
    </div>
  `;
  el.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    const oi = +b.dataset.oi, chosen = q.opts[oi], ok = !!chosen.ok;
    const correct = q.opts.findIndex(o => o.ok);
    el.querySelectorAll('.opt').forEach(x => {
      x.disabled = true;
      if(+x.dataset.oi === correct) x.classList.add('correct');
      if(+x.dataset.oi === oi && !ok) x.classList.add('chosen-wrong');
    });
    const rat = el.querySelector('#rat');
    rat.className = 'rationale on ' + (ok ? 'right' : 'wrong');
    rat.innerHTML = ok
      ? `<div class="tag">Correct</div><div class="why">${q.opts[correct].why}</div>`
      : `<div class="tag">Not quite</div>
         <div class="why"><b>You picked:</b> ${chosen.t}<br>${chosen.why}</div>
         <div class="miss"><b>The answer is:</b> ${q.opts[correct].t}<br>${q.opts[correct].why}</div>`;
    answers.push({ qi:quizOrder[qi], ok, chosen:oi });
    PROGRESS.quizState = { order:quizOrder, qi:answers.length, answers:answers.slice(), name:PROFILE.name };
    saveProgress();
    el.querySelector('#nextWrap').style.display = 'block';
    el.querySelector('#nextQ').onclick = () => {
      qi++;
      if(qi >= QUIZ.length) finishQuiz(el); else paintQuestion(el);
      window.scrollTo({top:0, behavior:'smooth'});
    };
  });
}
function resumeQuiz(){
  const st = PROGRESS.quizState;
  if(!st) return;
  quizOrder = st.order; answers = st.answers.slice(); qi = st.qi; quizLive = true;
  if(st.name && !PROFILE.name){ PROFILE.name = st.name; saveProfile(); }
  const el = document.getElementById('v-quiz');
  if(qi >= QUIZ.length) finishQuiz(el); else paintQuestion(el);
}
async function finishQuiz(el){
  quizLive = false;
  PROGRESS.quizState = null;
  const score = answers.filter(a=>a.ok).length;
  const pct = Math.round(score/QUIZ.length*100);
  const attempt = {
    id: 'a' + Date.now() + Math.floor(Math.random()*999),
    name: PROFILE.name || 'Unnamed',
    when: new Date().toISOString(),
    score, total: QUIZ.length, pct,
    detail: answers.map(a => ({ q:a.qi, ok:a.ok, chosen:a.chosen }))
  };
  ATTEMPTS.push(attempt);
  PROGRESS.quizTaken = true;
  await saveAttempts(); await saveProgress();
  if(PROFILE.share){
    const roster = (await store.get(NS+'roster', true)) || [];
    roster.push({ name:attempt.name, when:attempt.when, score, total:QUIZ.length, pct });
    await store.set(NS+'roster', roster.slice(-300), true);
  }
  const pass = score >= PASS;
  const missed = answers.filter(a => !a.ok).map(a => QUIZ[a.qi].q);
  el.innerHTML = `
    <div class="scorewrap">
      <div class="hint">Attempt ${ATTEMPTS.filter(a=>a.name===attempt.name).length} · ${esc(attempt.name)}</div>
      <div class="bigscore">${score}<span style="color:var(--muted);font-size:.5em">/${QUIZ.length}</span></div>
      <div class="stamp ${pass?'':'fail'}">${pass ? 'At standard' : 'Review needed'}</div>
      <p class="sub" style="margin:10px auto 0">${pass ? SPEC.quiz.passMsg : SPEC.quiz.failMsg}</p>
    </div>
    ${missed.length ? `<div class="panel"><div class="hint" style="margin-bottom:10px">What you missed</div>
      ${missed.map(m => `<div style="border-top:1px solid var(--line);padding:10px 0;font-size:15px">${m}</div>`).join('')}</div>` : ''}
    <div style="margin-top:22px;display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn" id="retake">Take it again</button>
      <button class="btn ghost" id="toRecords">See the record log</button>
      <button class="btn ghost" id="toGal">Back to the cards</button>
    </div>
  `;
  el.querySelector('#retake').onclick = () => { qi=0; answers=[]; quizLive=false; RENDER.quiz(); };
  el.querySelector('#toRecords').onclick = () => go('records');
  el.querySelector('#toGal').onclick = () => go('gallery');
  paintProgress();
}

/* ============================ VIEW: RECORDS ============================ */

      <div class="stat"><div class="k">Best score</div><div class="v">${best}<span style="font-size:.5em;color:var(--muted)">/${QUIZ.length}</span></div></div>
      <div class="stat"><div class="k">Average</div><div class="v">${avg}</div></div>
      <div class="stat"><div class="k">First to latest</div><div class="v">${first} → ${mine[0].score}</div></div>
    </div>

    <h3>Weakest questions first</h3>
    <div class="qbars">
      ${acc.slice(0,6).map(a => `
        <div class="qbar">
          <div class="track"><i style="width:${a.pct}%;background:${a.pct<50?'var(--crimson)':a.pct<80?'var(--amber)':'var(--green)'}"></i>

          <div class="pct">${a.pct}% · ${a.tries}x</div>
        </div>`).join('')}
    </div>

    <h3>Attempt log</h3>
    <div style="overflow-x:auto">
      <table class="rec">
        <thead><tr><th>#</th><th>Name</th><th>Date</th><th>Score</th><th>%</th><th>Missed</th></tr></thead>
        <tbody>
          ${mine.map((a,idx) => `<tr>

          </tr>`).join('')}

      </table>
    </div>` : `<div class="panel"><b style="font-family:var(--display);letter-spacing:.1em;text-transform:uppercase">Nothing logged yet</b>
      <p style="margin:10px 0 16px">Take the assessment and every attempt lands here with the date, score, and which questions went wrong.</p>

        <tr><td>Best sort</td><td>${PROGRESS.sortBest == null ? 'not attempted' : PROGRESS.sortBest + ' of ' + SPEC.sort.items.length}</td></tr>
        <tr><td>Scenarios run</td><td>${PROGRESS.scenarios.length} of ${SPEC.field.scenarios.length}${PROGRESS.scenarios.length ? ' · standard held in ' + PROGRESS.scenarios.filter(s=>s.win).length : ''}</td></tr>
        <tr><td>Ledger rows revealed</td><td>${PROGRESS.revealed.length} of ${SPEC.ledger.rows.length}</td></tr>
      </tbody>
    </table>

    <h3>Export and roster</h3>
    <div class="toolbar">
      <button class="btn" id="csvBtn" ${mine.length?'':'disabled'}>Show CSV</button>
      <button class="btn ghost" id="dlBtn" ${mine.length?'':'disabled'}>Download CSV</button>
      <button class="btn ghost" id="rosterBtn">Load cohort roster</button>
      <button class="btn ghost danger" id="clearBtn" ${mine.length?'':'disabled'}>Clear my records</button>
    </div>
    <textarea class="csv" id="csvOut" readonly></textarea>
    <div id="rosterOut"></div>
    <p class="note" style="margin-top:18px">Records are stored per person on this device. The cohort roster is a shared list, so anything you send there is readable by everyone else using this module.</p>

    <h3>Move progress to another machine</h3>
    <p class="note" style="margin-bottom:14px">This copies your whole state, scores, cards, sort, scenarios, and any paused attempt, into a block of text. Paste it into the same box on another device to land exactly where you left off.</p>
    <div class="toolbar">
      <button class="btn ghost" id="expBtn">Copy my progress</button>
      <button class="btn ghost" id="impBtn">Paste progress in</button>
    </div>
    <textarea class="csv" id="stateBox" placeholder="Paste a progress block here, then press Restore."></textarea>
    <div id="impActions" style="margin-top:10px;display:none"><button class="btn" id="doImp">Restore this progress</button></div>
    <div id="impStatus" class="feedback"></div>
  `;

  if(el.querySelector('#goQuizEmpty')) el.querySelector('#goQuizEmpty').onclick = () => go('quiz');

  const csv = () => {
    const head = ['attempt','name','timestamp','score','total','percent', ...QUIZ.map((q,i)=>'Q'+(i+1))];
    const rows = ATTEMPTS.map((a,i) => {
      const per = QUIZ.map((q,qi2) => { const d = a.detail.find(x=>x.q===qi2); return d ? (d.ok?1:0) : ''; });
      return [i+1, `"${String(a.name).replace(/"/g,'""')}"`, a.when, a.score, a.total, a.pct, ...per];
    });
    return [head.join(','), ...rows.map(r=>r.join(','))].join('\n');
  };
  const out = el.querySelector('#csvOut');
  if(el.querySelector('#csvBtn')) el.querySelector('#csvBtn').onclick = () => {
    out.value = csv(); out.classList.add('on'); out.focus(); out.select();
  };
  if(el.querySelector('#dlBtn')) el.querySelector('#dlBtn').onclick = () => {
    try{
      const blob = new Blob([csv()], {type:'text/csv'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = SPEC.code.toLowerCase() + '-results.csv';
      document.body.appendChild(a); a.click(); a.remove();
    }catch(e){ out.value = csv(); out.classList.add('on'); }
  };
  el.querySelector('#rosterBtn').onclick = async () => {
    const roster = (await store.get(NS+'roster', true)) || [];
    const box = el.querySelector('#rosterOut');
    if(!roster.length){ box.innerHTML = `<p class="note">Roster is empty. Results only land here when someone turns on sharing before taking the assessment.</p>`; return; }
    const sorted = roster.slice().sort((a,b) => b.score - a.score || new Date(a.when) - new Date(b.when));
    box.innerHTML = `<h3>Cohort roster · ${roster.length} entries</h3><div style="overflow-x:auto"><table class="rec">
      <thead><tr><th>Rank</th><th>Name</th><th>Score</th><th>%</th><th>Date</th></tr></thead>
      <tbody>${sorted.map((r,i) => `<tr><td>${i+1}</td><td>${esc(r.name)}</td><td>${r.score}/${r.total}</td><td>${r.pct}%</td><td style="white-space:nowrap">${new Date(r.when).toLocaleDateString()}</td></tr>`).join('')}</tbody>
    </table></div>`;
  };
  if(el.querySelector('#clearBtn')) el.querySelector('#clearBtn').onclick = async function(){
    if(this.dataset.armed !== '1'){ this.dataset.armed = '1'; this.textContent = 'Tap again to erase everything'; return; }
    ATTEMPTS = [];
    PROGRESS = { visited:['records'], dossiers:[], sortBest:null, scenarios:[], quizTaken:false,
      lastTab:'records', revealed:[], sortState:null, scenState:null, quizState:null, updatedAt:null };
    await saveAttempts(); await saveProgress();
    RENDER.records(); paintProgress();
  };

  const box = el.querySelector('#stateBox');
  el.querySelector('#expBtn').onclick = () => {
    box.value = btoa(unescape(encodeURIComponent(JSON.stringify({ v:1, m:SPEC.id, profile:PROFILE, progress:PROGRESS, attempts:ATTEMPTS }))));
    box.classList.add('on'); box.readOnly = true; box.focus(); box.select();
    el.querySelector('#impActions').style.display = 'none';
    toast('expBtn','Selected, now copy it');
  };
  el.querySelector('#impBtn').onclick = () => {
    box.value = ''; box.readOnly = false; box.classList.add('on'); box.focus();
    el.querySelector('#impActions').style.display = 'block';
  };
  el.querySelector('#doImp').onclick = async () => {
    const st = document.getElementById('impStatus');
    try{
      const data = JSON.parse(decodeURIComponent(escape(atob(box.value.trim()))));
      if(!data.progress) throw new Error('bad block');
      if(data.m && data.m !== SPEC.id){
        st.className = 'feedback on bad';
        st.textContent = 'That block is from a different module (' + data.m.toUpperCase() + '). Paste it into that one instead.';
        return;
      }
      PROFILE = Object.assign(PROFILE, data.profile || {});
      PROGRESS = Object.assign(PROGRESS, data.progress);
      if(Array.isArray(data.attempts)) ATTEMPTS = data.attempts;
      await saveProfile(); await saveAttempts(); await saveProgress();
      box.classList.remove('on'); el.querySelector('#impActions').style.display = 'none';
      ['v-brief'].forEach(id => { const v = document.getElementById(id); if(v) delete v.dataset.built; });
      activeScen = null; quizLive = false;
      RENDER.records(); paintProgress();
      const st2 = document.getElementById('impStatus');
      st2.className = 'feedback on good';
      st2.textContent = 'Restored. Sections, scores, and any paused attempt are back where they were.';
    }catch(e){
      st.className = 'feedback on bad';
      st.textContent = "That block didn't read as progress data. Copy the whole thing, including the very end.";
    }
  };
};

/* ============================ BOOT ============================ */
(async function(){
  await loadAll();
  buildHead();
  buildTabs();
  const returning = !!(PROGRESS.lastTab && PROGRESS.updatedAt);
  go(returning ? PROGRESS.lastTab : 'brief');
  if(returning) showResume();
  setInterval(paintSaved, 60000);
})();
</script>
